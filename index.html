<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c35">
  <title>Dashboard công việc | Tổ KPI</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d302d;
      --muted: #71817e;
      --line: #e4ebe8;
      --paper: #ffffff;
      --canvas: #f4f7f5;
      --green: #176b58;
      --green-dark: #123c35;
      --mint: #e9f4ef;
      --amber: #a76513;
      --amber-bg: #fff3df;
      --red: #b94a43;
      --red-bg: #fff0ee;
      --blue: #426d99;
      --blue-bg: #edf4fb;
      font-family: Inter, "Segoe UI", Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--canvas); }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar {
      min-height: 68px; display: flex; align-items: center; justify-content: space-between;
      gap: 20px; padding: 12px clamp(18px, 4vw, 56px); color: white; background: var(--green-dark);
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px;
      color: #d7f0e5; background: #245b4e; font-weight: 800; letter-spacing: -.04em;
    }
    .brand-name { font-size: 15px; font-weight: 700; }
    .brand-sub { margin-top: 3px; color: #b6ccc5; font-size: 12px; }
    .top-actions, .toolbar, .filters, .card-actions { display: flex; align-items: center; gap: 9px; }
    .topbar .button { border-color: #52756c; color: white; background: transparent; }
    .topbar .button:hover { background: #245349; }
    .main { width: min(1280px, calc(100% - 36px)); margin: 34px auto 60px; }
    .view-tabs { display: flex; gap: 7px; margin-bottom: 20px; padding: 5px; border: 1px solid var(--line); border-radius: 11px; background: white; width: fit-content; }
    .view-tab { min-height: 36px; padding: 0 14px; border: 0; border-radius: 7px; color: var(--muted); background: transparent; font-size: 13px; font-weight: 700; }
    .view-tab[aria-selected="true"] { color: white; background: var(--green); }
    .meeting-view { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: white; }
    .meeting-view-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 19px; border-bottom: 1px solid var(--line); }
    .meeting-view-head h2 { margin: 0; font-size: 16px; }
    .meeting-view-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .meeting-frame { display: block; width: 100%; height: 1250px; border: 0; background: #f9fafb; }
    .heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 8px 0 7px; font-size: clamp(24px, 3vw, 32px); letter-spacing: -.04em; }
    .intro { max-width: 700px; margin: 0; color: var(--muted); line-height: 1.55; font-size: 14px; }
    .button {
      display: inline-flex; min-height: 38px; align-items: center; justify-content: center; gap: 7px;
      padding: 0 13px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink);
      background: white; font-size: 13px; font-weight: 650; transition: .15s ease;
    }
    .button:hover { border-color: #b9ccc5; background: #f8fbf9; }
    .button.primary { border-color: var(--green); color: white; background: var(--green); }
    .button.primary:hover { background: #105544; }
    .button.small { min-height: 32px; padding: 0 10px; font-size: 12px; }
    .button.danger { color: var(--red); }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
    .stat {
      min-height: 106px; padding: 17px 18px; border: 1px solid var(--line); border-radius: 13px;
      background: var(--paper);
    }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .stat-bottom { display: flex; align-items: end; justify-content: space-between; margin-top: 12px; }
    .stat-value { font-size: 27px; font-weight: 750; letter-spacing: -.04em; }
    .stat-note { color: var(--muted); font-size: 11px; }
    .stat-icon {
      width: 31px; height: 31px; display: grid; place-items: center; border-radius: 10px;
      color: var(--green); background: var(--mint); font-weight: 800;
    }
    .panel { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--paper); }
    .panel-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 17px 20px; border-bottom: 1px solid var(--line);
    }
    .panel-title { margin: 0; font-size: 16px; }
    .panel-desc { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .filters { flex-wrap: wrap; }
    .field-control {
      min-height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
      color: var(--ink); background: white; font-size: 12px; outline: none;
    }
    .field-control:focus, textarea:focus { border-color: #80ae9e; box-shadow: 0 0 0 3px #eaf4ef; }
    .search { width: 190px; }
    .work-list { display: grid; gap: 12px; padding: 15px; }
    .group-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; padding: 15px; }
    .group-card { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: white; transition: border-color .15s ease, box-shadow .15s ease; }
    .group-card:hover { border-color: #b9ccc5; box-shadow: 0 8px 22px rgb(23 75 60 / 8%); }
    .group-card-trigger { display: grid; width: 100%; min-height: 188px; grid-template-columns: 1fr auto; align-content: start; gap: 16px; padding: 19px; border: 0; color: inherit; background: transparent; text-align: left; }
    .group-card-heading { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .group-number { width: 42px; height: 42px; display: grid; flex: 0 0 42px; place-items: center; border-radius: 13px; color: var(--green); background: var(--mint); font-size: 16px; font-weight: 800; }
    .group-title { margin: 0; font-size: 15px; line-height: 1.45; }
    .group-subtitle { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .group-card-arrow { align-self: center; color: var(--green); font-size: 20px; }
    .group-progress { grid-column: 1 / -1; }
    .group-progress .progress-caption { margin-bottom: 7px; }
    .group-stats { grid-column: 1 / -1; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; }
    .group-open-hint { grid-column: 1 / -1; margin-top: auto; color: var(--green); font-size: 11px; font-weight: 700; }
    .group-layer { position: fixed; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgb(18 38 33 / 55%); }
    .group-layer.hidden { display: none; }
    .group-layer-panel { display: flex; width: min(1050px, 100%); max-height: min(92vh, 1050px); flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--canvas); box-shadow: 0 24px 80px rgb(0 0 0 / 25%); }
    .group-layer-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--line); background: white; }
    .group-layer-head h2 { margin: 0; font-size: 18px; }
    .group-layer-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .group-layer-content { display: grid; grid-auto-rows: max-content; align-content: start; gap: 10px; overflow-y: auto; padding: 15px; }
    .task-item { overflow: hidden; border: 1px solid var(--line); border-radius: 11px; background: white; transition: border-color .15s ease, box-shadow .15s ease; }
    .task-item:hover { border-color: #b9ccc5; box-shadow: 0 5px 16px rgb(23 75 60 / 7%); }
    .task-item-summary { display: grid; width: 100%; grid-template-columns: minmax(0, 1fr) minmax(105px, 145px) auto; align-items: center; gap: 14px; padding: 14px 16px; border: 0; color: inherit; background: white; cursor: pointer; text-align: left; }
    .task-item-title { margin: 0; font-size: 13px; line-height: 1.45; }
    .task-item-owner { margin-top: 4px; color: var(--muted); font-size: 11px; }
    .task-item-status { display: flex; justify-content: flex-end; }
    .task-item-progress { min-width: 0; }
    .task-item-progress .progress-caption { margin-bottom: 5px; }
    .task-item-chevron { color: var(--muted); font-size: 19px; }
    .task-layer { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgb(18 38 33 / 64%); }
    .task-layer.hidden { display: none; }
    .task-layer-panel { display: flex; width: min(760px, 100%); max-height: min(92vh, 900px); flex-direction: column; overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--canvas); box-shadow: 0 24px 80px rgb(0 0 0 / 28%); }
    .task-layer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 22px; border-bottom: 1px solid var(--line); background: white; }
    .task-layer-head h2 { margin: 0; font-size: 18px; line-height: 1.45; }
    .task-layer-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
    .task-layer-content { overflow-y: auto; padding: 15px; }
    .task-detail-card { background: white; }
    .task-detail-card .work-title { font-size: 17px; }
    .task-detail-card .progress-block { width: 160px; flex-basis: 160px; }
    .task-detail-card .work-details { grid-template-columns: 1fr; }
    .task-detail-card .report-history { margin-top: 14px; }
    @media (max-width: 760px) {
      .task-item-summary { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; padding: 12px; }
      .task-item-status { grid-column: 1; grid-row: 2; justify-content: flex-start; }
      .task-item-progress { grid-column: 1 / -1; grid-row: 3; }
      .task-item-chevron { grid-column: 2; grid-row: 1; }
      .task-layer { padding: 8px; }
      .task-layer-panel { max-height: 96vh; border-radius: 12px; }
      .task-layer-head { padding: 14px; }
      .task-layer-content { padding: 10px; }
      .task-detail-card .work-top { flex-direction: column; gap: 13px; }
      .task-detail-card .progress-block { width: 100%; flex-basis: auto; }
    }
    .work-card { padding: 17px; border: 1px solid var(--line); border-radius: 12px; }
    .work-card:hover { border-color: #c9d8d2; }
    .work-top { display: flex; justify-content: space-between; gap: 18px; }
    .work-main { min-width: 0; flex: 1; }
    .work-labels { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-bottom: 8px; }
    .tag, .status {
      display: inline-flex; min-height: 22px; align-items: center; padding: 2px 8px;
      border-radius: 999px; font-size: 10px; font-weight: 750;
    }
    .tag { color: #42615a; background: #eef4f1; }
    .status.not-started { color: #65746f; background: #eff2f1; }
    .status.in-progress { color: var(--blue); background: var(--blue-bg); }
    .status.completed { color: var(--green); background: var(--mint); }
    .status.blocked { color: var(--amber); background: var(--amber-bg); }
    .status.overdue { color: var(--red); background: var(--red-bg); }
    .work-title { margin: 0; font-size: 16px; line-height: 1.4; letter-spacing: -.015em; }
    .work-owner { margin: 7px 0 0; color: var(--muted); font-size: 12px; }
    .work-owner strong { color: #445650; font-weight: 650; }
    .progress-block { width: 178px; flex: 0 0 178px; }
    .progress-caption { display: flex; justify-content: space-between; margin-bottom: 8px; color: var(--muted); font-size: 11px; }
    .progress-caption strong { color: var(--ink); font-size: 12px; }
    .progress-track { height: 7px; overflow: hidden; border-radius: 99px; background: #edf1ef; }
    .progress-fill { height: 100%; border-radius: inherit; background: #439579; transition: width .2s ease; }
    .work-meta {
      display: flex; flex-wrap: wrap; gap: 17px; margin-top: 15px; padding-top: 12px;
      border-top: 1px solid #f0f3f1; color: var(--muted); font-size: 11px;
    }
    .work-meta strong { color: #465752; font-weight: 650; }
    .work-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 13px; }
    .detail { min-width: 0; padding: 10px 11px; border-radius: 9px; background: #f7f9f8; }
    .detail-label { margin-bottom: 5px; color: var(--muted); font-size: 10px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
    .detail-text { color: #44534f; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .report-history { margin-top: 11px; border: 1px solid #e8eeeb; border-radius: 9px; background: #fbfcfb; }
    .report-history summary { padding: 10px 12px; color: #42615a; cursor: pointer; font-size: 11px; font-weight: 750; }
    .report-list { display: grid; gap: 8px; padding: 0 10px 10px; }
    .report-entry { padding: 10px; border-radius: 8px; background: white; }
    .report-entry-head { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; }
    .report-entry-head strong { color: #465752; font-size: 11px; }
    .report-entry-body { margin-top: 6px; color: #44534f; font-size: 12px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .report-empty { padding: 0 12px 12px; color: var(--muted); font-size: 11px; }
    .empty { padding: 45px 20px; color: var(--muted); text-align: center; font-size: 13px; }
    .footer-note { margin: 14px 3px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 5; display: none; align-items: center; justify-content: center;
      padding: 18px; background: rgb(18 38 33 / 48%);
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(650px, 100%); max-height: min(90vh, 850px); overflow: auto;
      border-radius: 15px; background: white; box-shadow: 0 20px 70px rgb(0 0 0 / 20%);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 22px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .icon-button { width: 32px; height: 32px; border: 0; border-radius: 8px; color: var(--muted); background: #f3f6f4; font-size: 18px; }
    .form { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 20px 22px; }
    .form-field { display: grid; gap: 6px; }
    .form-field.full { grid-column: 1 / -1; }
    .form-field label { color: #52635e; font-size: 11px; font-weight: 750; }
    .form input, .form select, .form textarea {
      width: 100%; min-height: 38px; padding: 9px 10px; border: 1px solid var(--line);
      border-radius: 8px; color: var(--ink); background: white; outline: none; font-size: 13px;
    }
    .form textarea { min-height: 85px; resize: vertical; line-height: 1.5; }
    .form-actions { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 10px; padding-top: 4px; }
    .hidden { display: none !important; }
    .toast {
      position: fixed; right: 20px; bottom: 20px; z-index: 10; padding: 12px 16px;
      border-radius: 10px; color: white; background: var(--green-dark); box-shadow: 0 8px 25px #0002;
      font-size: 13px; opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) {
      .main { width: min(calc(100% - 24px), 600px); margin-top: 20px; }
      .topbar { padding: 11px 14px; }
      .brand-sub { display: none; }
      .top-actions { gap: 6px; }
      .top-actions .button { min-height: 34px; padding: 0 8px; font-size: 11px; }
      .heading { display: block; }
      .heading .toolbar { margin-top: 15px; }
      .view-tabs { width: 100%; }
      .view-tab { flex: 1; padding: 0 9px; font-size: 12px; }
      .meeting-view-head { align-items: flex-start; flex-direction: column; padding: 14px; }
      .meeting-frame { height: 1450px; }
      .stats { grid-template-columns: repeat(2, 1fr); gap: 9px; }
      .stat { min-height: 92px; padding: 13px; }
      .stat-value { font-size: 24px; }
      .panel-head { align-items: flex-start; flex-direction: column; padding: 15px; }
      .filters { width: 100%; }
      .search { flex: 1; width: auto; min-width: 120px; }
      .group-list { grid-template-columns: 1fr; gap: 10px; padding: 10px; }
      .group-card-trigger { min-height: 166px; padding: 15px; }
      .group-layer { padding: 8px; }
      .group-layer-panel { max-height: 96vh; border-radius: 12px; }
      .group-layer-head { padding: 14px; }
      .group-layer-content { padding: 9px; }
      .work-card { padding: 14px; }
      .work-top { flex-direction: column; gap: 13px; }
      .progress-block { width: 100%; flex-basis: auto; }
      .work-details { grid-template-columns: 1fr; }
      .form { grid-template-columns: 1fr; padding: 16px; }
      .form-field.full, .form-actions { grid-column: auto; }
    }
    @media (max-width: 600px) {
      .topbar { min-height: 60px; gap: 10px; padding: calc(9px + env(safe-area-inset-top)) 12px 9px; }
      .brand { min-width: 0; gap: 9px; }
      .brand-mark { width: 36px; height: 36px; flex: 0 0 36px; border-radius: 11px; font-size: 14px; }
      .brand-name { font-size: 14px; line-height: 1.3; }
      .main { width: calc(100% - 24px); margin: 16px auto 32px; }
      .view-tabs { gap: 4px; margin-bottom: 12px; padding: 4px; border-radius: 10px; }
      .view-tab { min-height: 44px; padding: 0 7px; font-size: 12px; }
      .panel { border-radius: 12px; }
      .group-list { gap: 9px; padding: 8px; }
      .group-card { border-radius: 12px; }
      .group-card-trigger { min-height: 0; gap: 12px; padding: 14px; }
      .group-card-heading { gap: 10px; }
      .group-number { width: 38px; height: 38px; flex-basis: 38px; border-radius: 11px; font-size: 15px; }
      .group-title { font-size: 14px; line-height: 1.4; }
      .group-subtitle { font-size: 11px; line-height: 1.4; }
      .group-open-hint { margin-top: 0; }
      .group-layer, .task-layer, .modal-backdrop { align-items: stretch; padding: 0; }
      .group-layer-panel, .task-layer-panel, .modal {
        width: 100%; height: 100vh; height: 100dvh; max-height: none;
        border: 0; border-radius: 0;
      }
      .group-layer-head, .task-layer-head {
        flex: 0 0 auto; gap: 10px;
        padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
      }
      .group-layer-head h2, .task-layer-head h2 { font-size: 16px; }
      .group-layer-content, .task-layer-content { min-height: 0; flex: 1; overscroll-behavior: contain; }
      .group-layer-content { padding: 9px; }
      .task-layer-content { padding: 10px; }
      .task-item { border-radius: 10px; }
      .task-item-summary { min-height: 44px; padding: 11px; }
      .task-item-title { font-size: 13px; }
      .task-item-owner { line-height: 1.4; }
      .task-layer-head p { font-size: 11px; }
      .task-detail-card { padding: 12px; border-radius: 10px; }
      .task-detail-card .work-title { font-size: 16px; }
      .task-detail-card .work-top { gap: 11px; }
      .task-detail-card .card-actions { width: 100%; }
      .task-detail-card .card-actions .button { width: 100%; min-height: 42px; }
      .task-detail-card .work-meta { gap: 9px 14px; margin-top: 12px; padding-top: 10px; line-height: 1.45; }
      .task-detail-card .work-details { gap: 8px; margin-top: 10px; }
      .task-detail-card .detail { padding: 10px; }
      .task-detail-card .detail-text, .report-entry-body { font-size: 13px; line-height: 1.55; }
      .report-history summary { min-height: 42px; display: flex; align-items: center; padding: 9px 10px; line-height: 1.4; }
      .report-entry-head { flex-direction: column; gap: 3px; }
      .report-entry-head span { line-height: 1.4; }
      .modal-backdrop.open { display: flex; }
      .modal { overflow: auto; overscroll-behavior: contain; }
      .modal-head { position: sticky; top: 0; z-index: 1; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: white; }
      .modal-head h2 { font-size: 16px; }
      .form { gap: 14px; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); }
      .form-field label { font-size: 12px; }
      .form input, .form select, .form textarea { min-height: 44px; font-size: 16px; }
      .form textarea { min-height: 96px; }
      .form-actions { position: sticky; bottom: 0; z-index: 1; flex-wrap: wrap; padding: 10px 0 calc(8px + env(safe-area-inset-bottom)); background: white; }
      .form-actions > .button { min-height: 42px; }
      .form-actions > div { flex: 1; }
      .form-actions > div .button { flex: 1; min-height: 42px; }
      .meeting-view { border-radius: 12px; }
      .meeting-view-head { gap: 10px; padding: 12px; }
      .meeting-view-head h2 { font-size: 15px; }
      .meeting-view-head p { font-size: 12px; }
      .meeting-frame { min-height: 100vh; }
      .toast { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">KPI</div>
        <div>
          <div class="brand-name">Tổ Xây dựng DMSP &amp; KPI</div>
          <div class="brand-sub">Bệnh viện Đa khoa Thủ Đức · Cổng theo dõi công việc</div>
        </div>
      </div>
    </header>

    <main class="main">
      <nav class="view-tabs" aria-label="Khu vực dashboard">

          proposal: "Bảo đảm danh mục được cập nhật theo kế hoạch công tác của đơn vị."

          owner: "Huỳnh Mỹ Thư, Nguyễn Võ Minh Hoàng, Nguyễn Đình Thìn, Trần Thị Bích Ân, Linh Đức, Thanh Tới",
          due: "", status: "Chưa bắt đầu", progress: 0, reports: [],
          update: "Đề tài: Ứng dụng và đánh giá hiệu quả quy trình chuẩn xây KPI – FMFT tại các bệnh viện hạng I, hạng II trên địa bàn Thành phố Hồ Chí Minh.",
          proposal: "Bổ sung thành viên Tổ KPI và thống nhất đề cương, kế hoạch nghiên cứu."
        }
      ];

      const listEl = document.getElementById("work-list");
      const form = document.getElementById("work-form");
      const modal = document.getElementById("modal-backdrop");
      const groupLayer = document.getElementById("group-layer");
      const groupLayerContent = document.getElementById("group-layer-content");
      const taskLayer = document.getElementById("task-layer");
      const taskLayerContent = document.getElementById("task-layer-content");
      const groupNames = {
        1: "Chuẩn hóa tài liệu và khung năng lực",
        2: "KPI theo khung FMFT",
        3: "KPI theo lý thuyết và hướng đi mới",
        5: "Nhóm 4 · Đề tài nghiên cứu khoa học cấp Thành phố"
      };
      let tasks = loadTasks();
      let toastTimer;
      let activeGroup = null;
      let activeTaskId = null;

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return trackedTasks(seedTasks.map(task => ({ ...task })));
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Dữ liệu lưu không phải danh sách.");
          const normalized = parsed.filter(task => task && typeof task.id === "string")
            .map(task => normalizeTask(task));
          const oldGroupTasks = normalized.filter(task => /^(?:group|legacy-group)-[1-5]$/.test(task.id));
          const hasDetailedTasks = normalized.some(task => /^g[1-5]-/.test(task.id));
          const tasksWithoutOldGroups = normalized.filter(task => !oldGroupTasks.includes(task));
          const sourceTasks = oldGroupTasks.length && !hasDetailedTasks
            ? [...seedTasks.map(task => ({ ...task })), ...tasksWithoutOldGroups]
            : tasksWithoutOldGroups;
          const cleanedTasks = trackedTasks(sourceTasks);
          const removedLegacyData = oldGroupTasks.length > 0
            || normalized.some(task => task.reports.some(isLegacyReport));
          if (removedLegacyData) {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanedTasks));
            } catch (error) {
              console.error("Không thể xóa ghi chú tổng hợp cũ:", error);
              window.setTimeout(() => showToast("Không thể lưu thay đổi khi xóa ghi chú cũ."), 0);
            }
          }
          return cleanedTasks;
        } catch (error) {
          console.error("Không thể đọc dữ liệu dashboard:", error);
          window.setTimeout(() => showToast("Không đọc được dữ liệu lưu. Hãy thử nhập bản sao lưu JSON."), 0);
          return trackedTasks(seedTasks.map(task => ({ ...task })));
        }
      }

      function trackedTasks(items) {
        return items
          .filter(task => !EXCLUDED_GROUPS.has(Number(task.group)))
          .map(task => ({ ...task, reports: task.reports.filter(report => !isLegacyReport(report)) }));
      }

      function isLegacyReport(report) {
        return report.note.includes("Báo cáo tổng hợp trước khi tách đầu việc")
          || report.reporter.includes("báo cáo tổng hợp trước khi tách đầu việc");
      }

      function normalizeTask(task) {
        return {
          id: task.id, group: Math.min(5, Math.max(1, Number(task.group) || 1)),
          title: String(task.title || ""), owner: String(task.owner || ""),
          due: String(task.due || ""), status: validStatus(task.status) ? task.status : "Chưa bắt đầu",
          progress: clampProgress(task.progress), update: String(task.update || ""),
          proposal: String(task.proposal || ""),
          reports: Array.isArray(task.reports) ? task.reports.filter(report =>
            report && typeof report === "object" && String(report.note || "").trim()
          ).map(report => ({
            reporter: String(report.reporter || task.owner || ""),
            createdAt: String(report.createdAt || ""),
            progress: clampProgress(report.progress),
            status: validStatus(report.status) ? report.status : "Chưa bắt đầu",
            note: String(report.note || "")
          })) : []
        };
      }

      function validStatus(value) {
        return ["Chưa bắt đầu", "Đang thực hiện", "Đang vướng", "Hoàn thành"].includes(value);
      }

      function displayGroupNumber(group) {
        return Number(group) === 5 ? 4 : Number(group);
      }

      function clampProgress(value) {
        const number = Number(value);
        return Number.isFinite(number) ? Math.min(100, Math.max(0, Math.round(number))) : 0;
      }

      function persist() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Không thể lưu dữ liệu dashboard:", error);
          showToast("Không lưu được dữ liệu trên trình duyệt này.");
          return false;
        }
        pushCloud();
        return true;
      }

      const FIREBASE_CONFIG = {
        apiKey: "AIzaSyB4Sqqe4QoDl6Iz66CIBQmyLeFM8By4lJg",
        authDomain: "chinhphuckpi.firebaseapp.com",
        projectId: "chinhphuckpi",
        storageBucket: "chinhphuckpi.firebasestorage.app",
        messagingSenderId: "870517936115",
        appId: "1:870517936115:web:929eca25c6d234c0010c86"
      };
      const FIREBASE_VERSION = "10.12.2";
      let cloud = null;

      function pushCloud() {
        if (!cloud) return;
        cloud.setDoc(cloud.ref, { tasksJson: JSON.stringify(tasks), updatedAt: new Date().toISOString() })
          .catch(error => {
            console.error("Không thể đồng bộ lên Firebase:", error);
            showToast("Không đồng bộ được lên Firebase. Dữ liệu vẫn lưu trên máy này.");
          });
      }

      async function initCloud() {
        try {
          const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
          const [{ initializeApp }, { getFirestore, doc, onSnapshot, setDoc }] = await Promise.all([
            import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`)
          ]);
          const ref = doc(getFirestore(initializeApp(FIREBASE_CONFIG)), "dashboard", "main");
          cloud = { ref, setDoc };
          onSnapshot(ref, snapshot => {
            if (snapshot.metadata.hasPendingWrites) return;
            if (!snapshot.exists()) {
              pushCloud();
              return;
            }
            try {
              const parsed = JSON.parse(snapshot.data().tasksJson);
              if (!Array.isArray(parsed)) throw new Error("Dữ liệu Firebase không phải danh sách.");
              tasks = trackedTasks(parsed.filter(task => task && typeof task.id === "string").map(normalizeTask));
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (error) { console.error(error); }
              render();
            } catch (error) {
              console.error("Không thể đọc dữ liệu Firebase:", error);
              showToast("Dữ liệu trên Firebase không hợp lệ.");
            }
          }, error => {
            console.error("Lỗi đồng bộ Firebase:", error);
            showToast("Không kết nối được Firebase. Kiểm tra Rules của Firestore.");
          });
        } catch (error) {
          console.error("Không thể tải Firebase:", error);
          showToast("Không tải được Firebase. Đang dùng dữ liệu trên máy.");
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        })[character]);
      }

      function formatDate(value) {
        if (!value) return "Chưa xác định";
        const parts = value.split("-");
        return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : value;
      }

      function formatReportDate(value) {
        if (!value) return "Ngày chưa xác định";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return escapeHtml(value);
        return new Intl.DateTimeFormat("vi-VN", {
          dateStyle: "short", timeStyle: "short"
        }).format(date);
      }

      function statusClass(status) {
        return {
          "Chưa bắt đầu": "not-started", "Đang thực hiện": "in-progress",
          "Đang vướng": "blocked", "Hoàn thành": "completed"
        }[status] || "not-started";
      }

      function dueLabel(task) {
        if (!task.due) return "Chưa xác định";
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const dueDate = new Date(`${task.due}T00:00:00`);
        return dueDate < today && task.status !== "Hoàn thành"
          ? `<span class="status overdue">Quá hạn · ${escapeHtml(formatDate(task.due))}</span>`
          : escapeHtml(formatDate(task.due));
      }

      function renderTaskCard(task) {
        return `
          <article class="task-item">
            <button class="task-item-summary" type="button" data-open-task="${escapeHtml(task.id)}" aria-label="Mở chi tiết: ${escapeHtml(task.title)}">
              <div>
                <h3 class="task-item-title">${escapeHtml(task.title)}</h3>
                <div class="task-item-owner">${escapeHtml(task.owner || "Chưa phân công")}</div>
              </div>
              <div class="task-item-progress">
                <div class="progress-caption"><span>Tiến độ</span><strong>${task.progress}%</strong></div>
                <div class="progress-track" role="progressbar" aria-label="Tiến độ" aria-valuenow="${task.progress}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width:${task.progress}%"></div>
                </div>
              </div>
              <div class="task-item-status"><span class="status ${statusClass(task.status)}">${escapeHtml(task.status)}</span></div>
              <span class="task-item-chevron" aria-hidden="true">↗</span>
            </button>
          </article>`;
      }

      function renderTaskDetails(task) {
        return `
          <article class="work-card task-detail-card">
            <div class="work-top">
              <div class="work-main">
                <div class="work-labels">
                  <span class="tag">Nhóm ${displayGroupNumber(task.group)}</span>
                  <span class="status ${statusClass(task.status)}">${escapeHtml(task.status)}</span>
                </div>
                <p class="work-owner"><strong>Phụ trách:</strong> ${escapeHtml(task.owner || "Chưa phân công")}</p>
              </div>
              <div class="progress-block">
                <div class="progress-caption"><span>Tiến độ</span><strong>${task.progress}%</strong></div>
                <div class="progress-track" role="progressbar" aria-label="Tiến độ" aria-valuenow="${task.progress}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width:${task.progress}%"></div>
                </div>
              </div>
              <div class="card-actions">
                <button class="button small" type="button" data-edit="${escapeHtml(task.id)}">Cập nhật</button>
              </div>
            </div>
            <div class="work-meta">
              <span>Thời hạn: <strong>${dueLabel(task)}</strong></span>
              <span>Ghi chú báo cáo: <strong>${task.reports.length} lần</strong></span>
              <span>Đề xuất: <strong>${escapeHtml(task.proposal ? "Đã ghi nhận" : "Chưa có")}</strong></span>
            </div>
            <div class="work-details">
              <div class="detail"><div class="detail-label">Nội dung thực hiện</div><div class="detail-text">${escapeHtml(task.update || "Chưa có cập nhật.")}</div></div>
              <div class="detail"><div class="detail-label">Đề xuất / khó khăn</div><div class="detail-text">${escapeHtml(task.proposal || "Chưa có đề xuất.")}</div></div>
            </div>
            <details class="report-history" open>
              <summary>Nhật ký báo cáo của nhóm · ${task.reports.length} ghi chú</summary>
              ${task.reports.length ? `
                <div class="report-list">
                  ${[...task.reports].reverse().map(report => `
                    <div class="report-entry">
                      <div class="report-entry-head">
                        <strong>${escapeHtml(report.reporter || task.owner || "Nhóm thực hiện")}</strong>
                        <span>${formatReportDate(report.createdAt)} · ${report.progress}% · ${escapeHtml(report.status)}</span>
                      </div>
                      <div class="report-entry-body">${escapeHtml(report.note)}</div>
                    </div>`).join("")}
                </div>` : '<div class="report-empty">Chưa có báo cáo. Chọn “Cập nhật” để thêm ghi chú đầu tiên.</div>'}
            </details>
          </article>`;
      }

      function renderTaskLayer() {
        if (activeTaskId === null) return;
        const task = tasks.find(item => item.id === activeTaskId);
        if (!task) {
          closeTask();
          return;
        }
        document.getElementById("task-layer-title").textContent = task.title;
        document.getElementById("task-layer-summary").textContent =
          `Nhóm ${displayGroupNumber(task.group)} · ${task.progress}% hoàn thành`;
        taskLayerContent.innerHTML = renderTaskDetails(task);
      }

      function renderGroupLayer() {
        if (activeGroup === null) return;
        const groupTasks = tasks.filter(task => task.group === activeGroup);
        const title = groupNames[activeGroup] || `Nhóm ${activeGroup}`;
        const progress = groupTasks.length
          ? Math.round(groupTasks.reduce((sum, task) => sum + task.progress, 0) / groupTasks.length)
          : 0;
        document.getElementById("group-layer-title").textContent = title;
        document.getElementById("group-layer-summary").textContent =
          `${groupTasks.length} đầu việc · tiến độ nhóm ${progress}%`;
        groupLayerContent.innerHTML = groupTasks.length
          ? groupTasks.map(task => renderTaskCard(task)).join("")
          : '<div class="empty">Nhóm này hiện không có đầu việc.</div>';
      }

      function openGroup(group) {
        activeGroup = Number(group);
        renderGroupLayer();
        groupLayer.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        document.getElementById("close-group-layer").focus();
      }

      function openTask(taskId) {
        activeTaskId = taskId;
        renderTaskLayer();
        taskLayer.classList.remove("hidden");
        document.body.style.overflow = "hidden";
        document.getElementById("close-task-layer").focus();
      }

      function closeTask() {
        taskLayer.classList.add("hidden");
        activeTaskId = null;
        if (groupLayer.classList.contains("hidden")) document.body.style.overflow = "";
      }

      function closeGroup() {
        closeTask();
        groupLayer.classList.add("hidden");
        document.body.style.overflow = "";
        activeGroup = null;
      }

      function render() {
        renderGroupLayer();
        renderTaskLayer();

        if (!tasks.length) {
          listEl.innerHTML = '<div class="empty">Chưa có nhóm công việc để hiển thị.</div>';
          return;
        }
        const groupedTasks = new Map();
        tasks.forEach(task => {
          if (!groupedTasks.has(task.group)) groupedTasks.set(task.group, []);
          groupedTasks.get(task.group).push(task);
        });
        listEl.className = "group-list";
        listEl.innerHTML = [...groupedTasks.entries()].sort(([a], [b]) => a - b).map(([group, groupTasks]) => {
          const progress = Math.round(groupTasks.reduce((sum, task) => sum + task.progress, 0) / groupTasks.length);
          const activeCount = groupTasks.filter(task => task.status === "Đang thực hiện").length;
          const doneCount = groupTasks.filter(task => task.status === "Hoàn thành").length;
          const blockedCount = groupTasks.filter(task => task.status === "Đang vướng").length;
          const reportCount = groupTasks.reduce((sum, task) => sum + task.reports.length, 0);
          return `
          <article class="group-card">
            <button class="group-card-trigger" type="button" data-open-group="${group}" aria-label="Mở đầu việc của ${escapeHtml(groupNames[group] || `Nhóm ${displayGroupNumber(group)}`)}">
              <div class="group-card-heading">
                <span class="group-number">${displayGroupNumber(group)}</span>
                <div>
                  <h3 class="group-title">${escapeHtml(groupNames[group] || `Nhóm ${group}`)}</h3>
                  <div class="group-subtitle">${groupTasks.length} đầu việc · ${reportCount} ghi chú báo cáo</div>
                </div>
              </div>
              <span class="group-card-arrow" aria-hidden="true">↗</span>
              <div class="group-progress">
                <div class="progress-caption"><span>Tiến độ nhóm</span><strong>${progress}%</strong></div>
                <div class="progress-track" role="progressbar" aria-label="Tiến độ nhóm ${group}" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100">
                  <div class="progress-fill" style="width:${progress}%"></div>
                </div>
              </div>
              <div class="group-stats">
                ${activeCount ? `<span class="status in-progress">${activeCount} đang làm</span>` : ""}
                ${blockedCount ? `<span class="status blocked">${blockedCount} đang vướng</span>` : ""}
                <span class="status completed">${doneCount}/${groupTasks.length} hoàn thành</span>
              </div>
              <span class="group-open-hint">Nhấp để xem đầu việc và báo cáo →</span>
            </button>
          </article>`;
        }).join("");
      }

      function openForm(task) {
        form.reset();
        document.getElementById("work-id").value = task ? task.id : "";
        document.getElementById("modal-title").textContent = task ? "Cập nhật công việc" : "Thêm công việc";
        document.getElementById("work-title").value = task ? task.title : "";
        document.getElementById("work-group").value = task ? String(task.group) : "1";
        document.getElementById("work-owner").value = task ? task.owner : "";
        document.getElementById("work-due").value = task ? task.due : "";
        document.getElementById("work-status").value = task ? task.status : "Chưa bắt đầu";
        document.getElementById("work-progress").value = task ? task.progress : 0;
        document.getElementById("work-update").value = task ? task.update : "";
        document.getElementById("work-proposal").value = task ? task.proposal : "";
        document.getElementById("work-reporter").value = task ? task.owner : "";
        document.getElementById("work-report").value = "";

        modal.classList.add("open");
        document.getElementById("work-title").focus();

      function closeForm() {
        modal.classList.remove("open");
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toast.classList.remove("show"), 2600);
      }

      document.getElementById("close-modal").addEventListener("click", closeForm);
      document.getElementById("cancel-button").addEventListener("click", closeForm);
      modal.addEventListener("click", event => { if (event.target === modal) closeForm(); });
      document.getElementById("close-group-layer").addEventListener("click", closeGroup);
      groupLayer.addEventListener("click", event => { if (event.target === groupLayer) closeGroup(); });
      document.getElementById("close-task-layer").addEventListener("click", closeTask);
      taskLayer.addEventListener("click", event => { if (event.target === taskLayer) closeTask(); });
      document.addEventListener("keydown", event => {
        if (event.key !== "Escape") return;
        if (modal.classList.contains("open")) closeForm();
        else if (!taskLayer.classList.contains("hidden")) closeTask();
        else if (!groupLayer.classList.contains("hidden")) closeGroup();
      });
      const tasksTab = document.getElementById("tasks-tab");
      const minutesTab = document.getElementById("minutes-tab");
      const tasksView = document.getElementById("tasks-view");
      const minutesView = document.getElementById("minutes-view");
      const minutesFrame = document.getElementById("minutes-frame");
      let minutesFrameObserver = null;

      function resizeMinutesFrame() {
        const frameDocument = minutesFrame.contentDocument;
        if (!frameDocument || !frameDocument.documentElement || !frameDocument.body) {
          console.error("Không thể đọc nội dung khung biên bản để điều chỉnh chiều cao.");
          return;
        }
        const height = Math.max(frameDocument.documentElement.scrollHeight, frameDocument.body.scrollHeight);
        minutesFrame.style.height = `${height}px`;
      }

      minutesFrame.addEventListener("load", () => {
        if (minutesFrameObserver) minutesFrameObserver.disconnect();
        resizeMinutesFrame();
        if ("ResizeObserver" in window) {
          minutesFrameObserver = new ResizeObserver(() => window.requestAnimationFrame(resizeMinutesFrame));
          minutesFrameObserver.observe(minutesFrame.contentDocument.documentElement);
          minutesFrameObserver.observe(minutesFrame.contentDocument.body);
        }
      });
      window.addEventListener("resize", resizeMinutesFrame);

      function showView(view) {
        const showMinutes = view === "minutes";
        tasksTab.setAttribute("aria-selected", String(!showMinutes));
        minutesTab.setAttribute("aria-selected", String(showMinutes));
        tasksView.classList.toggle("hidden", showMinutes);
        minutesView.classList.toggle("hidden", !showMinutes);
        if (showMinutes) {
          if (!minutesFrame.src) minutesFrame.src = minutesFrame.dataset.src;
          else resizeMinutesFrame();
        }
      }
      tasksTab.addEventListener("click", () => showView("tasks"));
      minutesTab.addEventListener("click", () => showView("minutes"));

      listEl.addEventListener("click", event => {
        const groupButton = event.target.closest("[data-open-group]");
        if (groupButton) {
          openGroup(groupButton.dataset.openGroup);
          return;
        }
        const editButton = event.target.closest("[data-edit]");
        if (!editButton) return;
        const task = tasks.find(item => item.id === editButton.dataset.edit);
        if (task) openForm(task);
      });

      groupLayerContent.addEventListener("click", event => {
        const taskButton = event.target.closest("[data-open-task]");
        if (taskButton) {
          openTask(taskButton.dataset.openTask);
          return;
        }
        const editButton = event.target.closest("[data-edit]");
        if (!editButton) return;
        const task = tasks.find(item => item.id === editButton.dataset.edit);
        if (task) openForm(task);
      });

      taskLayerContent.addEventListener("click", event => {
        const editButton = event.target.closest("[data-edit]");
        if (!editButton) return;
        const task = tasks.find(item => item.id === editButton.dataset.edit);
        if (task) openForm(task);
      });

      form.addEventListener("submit", event => {
        event.preventDefault();
        const id = document.getElementById("work-id").value;
        const progress = clampProgress(document.getElementById("work-progress").value);
        let status = document.getElementById("work-status").value;
        if (progress === 100) status = "Hoàn thành";
        const record = {
          id: id || (window.crypto && crypto.randomUUID ? crypto.randomUUID() : `task-${Date.now()}`),
          group: Number(document.getElementById("work-group").value),
          title: document.getElementById("work-title").value.trim(),
          owner: document.getElementById("work-owner").value.trim(),
          due: document.getElementById("work-due").value,
          status, progress,
          update: document.getElementById("work-update").value.trim(),
          proposal: document.getElementById("work-proposal").value.trim(),
          reports: id ? [...(tasks.find(task => task.id === id)?.reports || [])] : []
        };
        const reportNote = document.getElementById("work-report").value.trim();
        if (reportNote) {
          record.reports.push({
            reporter: document.getElementById("work-reporter").value.trim() || record.owner || `Nhóm ${record.group}`,
            createdAt: new Date().toISOString(), progress, status, note: reportNote
          });
        }
        const index = tasks.findIndex(task => task.id === id);
        if (index >= 0) tasks[index] = record;
        else tasks.unshift(record);
        if (!persist()) return;
        closeForm();
        render();
        showToast(reportNote ? "Đã lưu công việc và ghi chú báo cáo." : "Đã lưu cập nhật công việc.");
      });

      document.getElementById("delete-button").addEventListener("click", () => {
        const id = document.getElementById("work-id").value;
        const task = tasks.find(item => item.id === id);
        if (!task || !window.confirm(`Xóa công việc “${task.title}”?`)) return;
        tasks = tasks.filter(item => item.id !== id);
        if (!persist()) return;
        closeForm();
        render();
        showToast("Đã xóa công việc.");
      });

      render();
      initCloud();
    })();
  </script>
</body>
</html>
